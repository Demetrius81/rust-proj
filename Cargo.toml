[package]
name = "rust-proj"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
mini-redis = "0.4.1"
axum = "0.8.1"
axum-server = "0.7.2"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
anyhow = "1"
rand = "0.9.1"
tower-http = { version = "0.6.2", features = ["catch-panic"] }


[dev-dependencies]
anyhow = "1"
httpc-test = "0.1.10"
